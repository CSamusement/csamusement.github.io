# Controllo automatico giornaliero
#  - "sveglia" Supabase, così il piano gratuito non va in pausa per inattività
#  - scadenze a 6 mesi, cancellazione rifiutati dopo 12 mesi, pulizia foto abbandonate
name: Controllo giornaliero

on:
  schedule:
    - cron: '17 6 * * *'   # ogni giorno alle 6:17 UTC
  workflow_dispatch:

permissions:
  actions: write   # serve solo a tenere attivo questo controllo (vedi ultimo passo)

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - name: Sveglia Supabase
        run: |
          curl -sf "https://hocxpkmphqjpqeghtxff.supabase.co/rest/v1/impostazioni?select=id" \
            -H "apikey: sb_publishable_kaisOm2pfk-BezdQZkY53w__E1vXeah" > /dev/null
          echo "Supabase risponde ✓"

      - name: Scadenze 6 mesi, cancellazioni 12 mesi, pulizia foto
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Segreto CRON_SECRET non impostato: salto"; exit 0; fi
          curl -sf -X POST "https://hocxpkmphqjpqeghtxff.supabase.co/functions/v1/giornaliero" \
            -H "apikey: sb_publishable_kaisOm2pfk-BezdQZkY53w__E1vXeah" \
            -H "x-cron-secret: $CRON_SECRET"
          echo

      # GitHub sospende i controlli programmati dopo 60 giorni senza modifiche al codice:
      # questo passo lo impedisce (senza creare modifiche finte).
      # bloccato su una versione precisa (v1.2.1): se l'autore la cambiasse, qui non cambia nulla
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
